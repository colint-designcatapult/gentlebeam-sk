// Status of a plan prescription and simulation
enum STATUS {
  // Default value
  STATUS_UNSPECIFIED = 0;

  // Status is pending approval
  STATUS_PENDING_APPROVAL = 1;

  // Status is approved
  STATUS_APPROVED = 2;

  // Status is rejected
  STATUS_REJECTED = 3;
}

// The position of a patient during a procedure or simulation.
enum POSITION {
  // Default value.
  POSITION_UNSPECIFIED = 0;

  // Prone position, patient lying flat on a bed face down.
  POSITION_PRONE = 1;

  // Supine position, patient lying flat on a bed face up.
  POSITION_SUPINE = 2;

  // Sitting position, patient sitting down in a chair.
  POSITION_SITTING = 3;

  // Side-lying position, patient lying down on their right side.
  POSITION_LYING_RT = 4;

  // Side-lying position, patient lying down on their left side.
  POSITION_LYING_LT = 5;

  // Head turned to the left.
  POSITION_HEAD_LEFT = 6;

  // Head turned to the right.
  POSITION_HEAD_RIGHT = 7;
}

// Energy values
enum ENERGY {
  // Unspecified energy
  ENERGY_UNSPECIFIED = 0;
  // 50Kv
  ENERGY_50 = 1;
  // 70Kv
  ENERGY_70 = 2;
  // 100Kv
  ENERGY_100 = 3;
}

