}

// An enumeration of types of patient identification number types, generally government-issued.
// The patient ID is intended to identify the patient in imaging providers like PACS servers.
enum PATIENTIDTYPE {
  // Default value
  PATIENTIDTYPE_UNSPECIFIED = 0;

  // Social-Security number, generally applicable for permanent US residents
  PATIENTIDTYPE_SSN = 1;

  // Passport number
  PATIENTIDTYPE_PASSPORT = 2;

  // Some other identification scheme
  PATIENTIDTYPE_OTHER = 3;
}

