asyncapi: 3.0.0
info:
  title: DeepColor Server Push API
  version: 1.0.0
  description: API for real-time notifications when an acquisition completes.
defaultContentType: application/json

servers:
  DeepColor:
    host: '0.0.0.0:33500'
    pathname: /ws
    protocol: ws
    description: Production server for real-time notifications.

channels:
  /:
    address: /
    description: Root WebSocket channel used for server push events.
    messages:
      acquisitionMessage:
        name: Acquisition
        contentType: application/json
        payload:
          type: object
          required:
            - event
            - acqId
          properties:
            event:
              type: string
              enum: [ acquisition.done ]
              description: Fixed event name.
            acqId:
              type: integer
              description: Unique identifier of the completed acquisition.
          examples:
            - event: acquisition.done
              acqId: 12345
              
      measurementMessage:
        name: Measurement
        contentType: application/json
        payload:
          type: object
          required:
            - event
            - measurementId
          properties:
            event:
              type: string
              enum: [ measurement.done ]
              description: Fixed event name.
            acqId:
              type: integer
              description: Unique identifier of the associated acquisition.
            measurementValue:
              type: number
              description: The value of the completed measurement.
          examples:
            - event: measurement.done
              acqId: 12345
              measurementValue: 2.6

operations:
  acquisitionPush:
    action: send
    channel:
      $ref: '#/channels/~1'
    messages:
      - $ref: '#/channels/~1/messages/acquisitionMessage'

  measurementPush:
    action: send
    channel:
      $ref: '#/channels/~1'
    messages:
      - $ref: '#/channels/~1/messages/measurementMessage'
