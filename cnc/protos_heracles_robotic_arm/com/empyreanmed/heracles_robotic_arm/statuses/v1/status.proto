syntax = "proto3";
package com.empyreanmed.heracles_robotic_arm.statuses.v1;

// Status
enum Status {
  // Unspecified
  STATUS_UNSPECIFIED = 0;
  // Activated
  STATUS_ACTIVATED = 1;
  // Deactivated
  STATUS_DEACTIVATED = 2;
  // Robotic Failure
  STATUS_ROBOTIC_FAILURE = 3;
  // ROS Server Failure
  STATUS_ROS_SERVER_FAILURE = 4;
  // ROS Client Failure
  STATUS_ROS_CLIENT_FAILURE = 5;
}
