syntax = "proto3";

package com.empyreanmed.heracles_robotic_arm.matrices.v1;

// Message for 4x4 matrix
message Matrix4x4 {
  // row 1, column 1
  float a11 = 1;
  // row 1, column 2
  float a12 = 2;
  // row 1, column 3
  float a13 = 3;
  // row 1, column 4
  float a14 = 4;
  // row 2, column 1
  float a21 = 5;
  // row 2, column 2
  float a22 = 6;
  // row 2, column 3
  float a23 = 7;
  // row 2, column 4
  float a24 = 8;
  // row 3, column 1
  float a31 = 9;
  // row 3, column 2
  float a32 = 10;
  // row 3, column 3
  float a33 = 11;
  // row 3, column 4
  float a34 = 12;
  // row 4, column 1
  float a41 = 13;
  // row 4, column 2
  float a42 = 14;
  // row 4, column 3
  float a43 = 15;
  // row 4, column 4
  float a44 = 16;
}
