syntax = "proto3";
package com.empyreanmed.heracles_robotic_arm.operating_modes.v1;

// Operating mode
enum OperatingMode {
  // Proto best practices requirement, unused
  OPERATING_MODE_UNSPECIFIED = 0;
  // Remote, program control is activated
  OPERATING_MODE_REMOTE_CONTROL = 1;
  // Local, program control is deactivated
  OPERATING_MODE_LOCAL_CONTROL = 2;
}
