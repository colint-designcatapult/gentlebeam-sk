name: Build HVPS interface firmware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-firmware:
    name: Firmware package (${{ matrix.configuration }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: Debug
            bootloader-preset: Debug
          - configuration: Release
            preset: Release
            bootloader-preset: Release
          - configuration: CalibrationDebug
            preset: CalibrationDebug
            bootloader-preset: Debug

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MCUboot image tool dependencies
        shell: bash
        run: python -m pip install --requirement mcuboot/mcuboot-2.4.0/scripts/requirements.txt

      - name: Resolve HVPS release versions
        id: versions
        shell: bash
        run: |
          echo "main=$(python tools/resolve_dcdoc_version.py --component hvps-interface/main)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(python tools/resolve_dcdoc_version.py --component hvps-interface/bootloader)" >> "$GITHUB_OUTPUT"

      - name: Build bootloader
        uses: uoohyo/action-stm32-cmake@v1.21.0
        with:
          project-path: hvps-interface/bootloader
          build-target: all
          cmake-args: --preset ${{ matrix.bootloader-preset }}

      - name: Build main firmware
        uses: uoohyo/action-stm32-cmake@v1.21.0
        with:
          project-path: hvps-interface/main
          build-target: all
          cmake-args: --preset ${{ matrix.preset }} -DFW_VERSION=${{ steps.versions.outputs.main }}

      - name: Create signed MCUboot images
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.versions.outputs.main }}
        run: |
          main_output_directory="hvps-interface/main/build/${{ matrix.preset }}"
          bootloader_output_directory="hvps-interface/bootloader/build/${{ matrix.bootloader-preset }}"
          sudo chown -R "$USER:$USER" "$main_output_directory" "$bootloader_output_directory"
          image_version="${IMAGE_VERSION%%-*}"
          python mcuboot/mcuboot-2.4.0/scripts/imgtool.py sign \
            --slot-size 0x2D000 \
            --header-size 0x200 \
            --pad-header \
            --align 4 \
            --version "$image_version" \
            "$main_output_directory/gryphon-hvps-interface-fw.hex" \
            "$main_output_directory/gryphon-hvps-interface-fw.unsigned.bin"
          python mcuboot/mcuboot-2.4.0/scripts/imgtool.py sign \
            --slot-size 0x2D000 \
            --header-size 0x200 \
            --pad-header \
            --align 4 \
            --version "$image_version" \
            "$main_output_directory/gryphon-hvps-interface-fw.hex" \
            "$main_output_directory/gryphon-hvps-interface-fw.unsigned.hex"
          python mcuboot/mcuboot-2.4.0/scripts/imgtool.py sign \
            --key hvps-interface/bootloader/keys/signing-key.pem \
            --slot-size 0x2D000 \
            --header-size 0x200 \
            --pad-header \
            --align 4 \
            --version "$image_version" \
            "$main_output_directory/gryphon-hvps-interface-fw.hex" \
            "$main_output_directory/gryphon-hvps-interface-fw.signed.bin"
          python mcuboot/mcuboot-2.4.0/scripts/imgtool.py sign \
            --key hvps-interface/bootloader/keys/signing-key.pem \
            --slot-size 0x2D000 \
            --header-size 0x200 \
            --pad-header \
            --align 4 \
            --version "$image_version" \
            "$main_output_directory/gryphon-hvps-interface-fw.hex" \
            "$main_output_directory/gryphon-hvps-interface-fw.signed.hex"
          python tools/firmware_hex.py combine \
            --input "$bootloader_output_directory/hvps-interface-bootloader.hex" \
            --input "$main_output_directory/gryphon-hvps-interface-fw.signed.hex" \
            --output "$main_output_directory/gryphon-hvps-interface-fw.combined.hex"

      - name: Verify build outputs
        shell: bash
        run: |
          main_output_directory="hvps-interface/main/build/${{ matrix.preset }}"
          bootloader_output_directory="hvps-interface/bootloader/build/${{ matrix.bootloader-preset }}"
          test -f "$main_output_directory/gryphon-hvps-interface-fw.elf"
          test -f "$main_output_directory/gryphon-hvps-interface-fw.hex"
          test -f "$main_output_directory/gryphon-hvps-interface-fw.signed.bin"
          test -f "$main_output_directory/gryphon-hvps-interface-fw.signed.hex"
          test -f "$main_output_directory/gryphon-hvps-interface-fw.combined.hex"
          test -f "$bootloader_output_directory/hvps-interface-bootloader.elf"
          test -f "$bootloader_output_directory/hvps-interface-bootloader.hex"

      - name: Package firmware
        shell: bash
        run: |
          main_output_directory="hvps-interface/main/build/${{ matrix.preset }}"
          bootloader_output_directory="hvps-interface/bootloader/build/${{ matrix.bootloader-preset }}"
          package_basename="hvps-interface.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}"
          python tools/package_release.py \
            --output "release/${package_basename}.zip" \
            --file "$main_output_directory/gryphon-hvps-interface-fw.elf=gryphon-hvps-interface-fw.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}.elf" \
            --file "$main_output_directory/gryphon-hvps-interface-fw.hex=gryphon-hvps-interface-fw.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}.hex" \
            --file "$main_output_directory/gryphon-hvps-interface-fw.signed.bin=gryphon-hvps-interface-fw.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}.signed.bin" \
            --file "$main_output_directory/gryphon-hvps-interface-fw.signed.hex=gryphon-hvps-interface-fw.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}.signed.hex" \
            --file "$main_output_directory/gryphon-hvps-interface-fw.combined.hex=gryphon-hvps-interface-fw.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}.combined.hex" \
            --file "$bootloader_output_directory/hvps-interface-bootloader.elf=hvps-interface-bootloader.${{ matrix.bootloader-preset }}.${{ steps.versions.outputs.bootloader }}.elf" \
            --file "$bootloader_output_directory/hvps-interface-bootloader.hex=hvps-interface-bootloader.${{ matrix.bootloader-preset }}.${{ steps.versions.outputs.bootloader }}.hex"
          python -m zipfile -e \
            "release/${package_basename}.zip" \
            "cache-payload/hvps/${{ matrix.configuration }}/Firmware/hvps-interface"



      - name: Upload individual firmware package
        uses: actions/upload-artifact@v7
        with:
          name: hvps-interface.${{ matrix.configuration }}.${{ steps.versions.outputs.main }}
          path: cache-payload/hvps/${{ matrix.configuration }}/Firmware/hvps-interface
          if-no-files-found: error

